<!doctype html>
<html lang="en">
  <head>
    <title>Bytes</title>
    <link rel="me" href="https://mastodon.social/@CurtisAutery" />
    <meta name="viewport" content="width=500" />
    <meta charset="UTF-8" />
    <meta name="author" content="Curtis Autery" />
    <meta
      name="description"
      content="A minimalist blog from a pretty ok software writer"
    />
    <meta property="og:title" content="Bytes" />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://blog.autery.net/images/plate.jpg"
    />
    <meta property="og:url" content="https://blog.autery.net/" />
    <meta
      property="og:description"
      content="A minimalist blog from a pretty ok software writer"
    />
    <style>
      :root {
        color-scheme: light dark;
        --background-color: light-dark(#fff, #2f2f2f);
        --text-color: light-dark(#000, #fff);
        --nav-border-color: light-dark(
          rgba(10, 10, 10, 0.1),
          rgba(200, 200, 200, 0.1)
        );
        --nav-hover-color: light-dark(#f4f4f4, #555);
        --code-background-color: light-dark(#f0f0f0, #444);
        --code-color: light-dark(#000, #fff);
        --blockquote-border-color: light-dark(#eee, #666);
        --blockquote-color: light-dark(#444, #ccc);
        --table-border-color: light-dark(#dbdbdb, #555);
        --table-hover-color: light-dark(#f5f5f5, #444);
        --link-color: light-dark(#0045e6, #66d9ef);
        --link-hover-color: light-dark(#363636, #fff);
        --tooltip-background-color: light-dark(#fff, #444);
        --tooltip-border-color: light-dark(#dbdbdb, #666);
        --header-background-color: light-dark(
          rgba(255, 255, 255, 1),
          rgba(47, 47, 47, 1)
        );
      }
      .katex {
        font-size: 1.25em;
      }
      html {
        scroll-padding-top: 96px;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100%;
        margin: 0;
        font-family: system-ui;
        font-size: 1.25em;
        line-height: 1.5;
        background-color: var(--background-color);
        color: var(--text-color);
      }
      header {
        margin-left: 1em;
        position: sticky;
        top: 0;
        width: 100%;
        background-color: var(--header-background-color);
        z-index: 1;
      }
      nav {
        margin: 0.5em 0;
        border-bottom: 3px solid var(--nav-border-color);
        line-height: 2;
        max-width: 600px;
      }
      nav a {
        display: inline-block;
        padding: 0 2em;
        text-decoration: none;
        color: inherit;
      }
      nav a:hover {
        background-color: var(--nav-hover-color);
      }
      nav a.live {
        border-bottom: 3px solid #198e53;
      }
      article {
        flex-grow: 1;
        padding: 1em 15%;
        margin: 0 14pt;
      }
      article:focus {
        outline: none;
      }
      article h1 {
        font-size: 30px;
        text-align: center;
      }
      p.hero {
        display: flex;
        justify-content: center;
      }
      article blockquote {
        border-left: 5px solid var(--blockquote-border-color);
        padding-left: 1em;
        margin-left: 0;
        color: var(--blockquote-color);
      }
      a {
        color: var(--link-color);
        text-decoration: none;
      }
      a:hover {
        color: var(--link-hover-color);
      }
      code,
      p.codez {
        font-family: Menlo, monospace;
        font-size: 0.875em;
      }
      .codez {
        background-color: var(--code-background-color);
        padding: 0.75em;
        color: var(--code-color);
        overflow: scroll;
      }
      p.codez {
        white-space: pre;
      }
      .codez strong {
        color: #dda790;
      }
      .codez em {
        color: #26d980;
      }
      tr:hover {
        background-color: var(--table-hover-color);
      }
      td,
      th {
        border: 1px solid var(--table-border-color);
        padding: 0.5em 0.75em;
        vertical-align: top;
      }
      td {
        border-width: 0 0 1px;
      }
      th {
        width: 30%;
        color: var(--link-hover-color);
        text-align: left;
        border-width: 0 0 2px;
      }
      th:first-of-type {
        width: 20%;
      }
      th:last-of-type {
        width: 50%;
      }
      .math {
        font-family: Times;
        font-size: 1.25em;
      }
      article pre {
        white-space: pre-wrap;
        word-wrap: break-word;
        overflow: auto;
        font-size: 90%;
        background-color: var(--code-background-color);
        padding: 0.5em;
      }
      article p > code {
        background-color: var(--code-background-color);
      }
      article img {
        max-width: 100%;
        height: auto;
      }
      .tooltip {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        border: 2px solid var(--tooltip-border-color);
        padding: 5pt;
        background: var(--tooltip-background-color);
      }
      .hover img:hover + .tooltip,
      .tooltip:hover {
        display: inline;
      }
      @media screen and (max-width: 1200px) {
        body {
          font-size: 1.125em;
        }
        article {
          padding: 1em 10%;
        }
      }
      @media screen and (max-width: 1024px) {
        body {
          font-size: 1em;
        }
        article {
          padding: 1em 5%;
        }
      }
      @media screen and (max-width: 900px) {
        body {
          font-size: 1em;
        }
        article {
          padding: 1em 0;
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <header>
      Curtis Autery, pretty ok software writer.
      <nav><a href="/" class="live">blog</a> <a href="/about">about</a></nav>
    </header>
    <article>
      <h1>Bytes</h1>
      <div>Things I think about</div>
      <ul>
        <li><code>2025-05-20</code> - <a href="/blog/llm/"> Local LLMs</a></li>
      </ul>
    </article>
  </body>
</html>
